<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de pedido | Cafetería</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="contenedor-principal">
        <aside class="presentacion">
            <div class="icono" aria-hidden="true">☕</div>
            <div class="textos-presentacion">
            <p class="nombre-cafeteria">CAFETERÍA</p>
            <h1>
            Registro de pedido
             </h1>
             </div>
        </aside>
        <section class="formulario">
            <form id="formulario" action="/pedido" method="POST">
                <div class="rejilla">
                    <div class="grupo">
                        <label for="nombre">Nombre del cliente</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Escribe el nombre" autocomplete="name" required>
                    </div>

                    <div class="grupo">
                        <label for="correoElectronico">Correo electrónico</label>
                        <input type="email" id="correoElectronico" name="correoElec" placeholder="correo@ejemplo.com" autocomplete="email" required>
                    </div>

                    <div class="grupo">
                        <label for="produc">Producto</label>
                        <select name="productos" id="produc" required>
                            <option value="">Selecciona un producto</option>
                            <option value="Café">Café</option>
                            <option value="Americano">Americano</option>
                            <option value="Capuchino">Capuchino</option>
                            <option value="Latte">Latte</option>
                            <option value="Moka">Moka</option>
                            <option value="Chocolate">Chocolate</option>
                            <option value="Té">Té</option>
                        </select>
                    </div>

                    <div class="grupo">
                        <label for="cantidad">Cantidad</label>
                        <input type="number" id="cantidad" name="cantidad" min="1" max="99" step="1" value="1" required>
                    </div>

                    <fieldset class="grupo grupo-tamano">
                        <legend>Tamaño</legend>
                        <div class="opciones-tamano">
                            <label class="opcion"><input type="radio" name="tamanio" id="tamanioChico" value="Chico" required> <span>Chico</span></label>
                            <label class="opcion"><input type="radio" name="tamanio" id="tamanioMediano" value="Mediano"> <span>Mediano</span></label>
                            <label class="opcion"><input type="radio" name="tamanio" id="tamanioGrande" value="Grande"> <span>Grande</span></label>
                        </div>
                    </fieldset>

                    <label class="opcion llevar" for="llevar">
                        <input type="checkbox" id="llevar" name="llevar" value="Si">
                        <span>Pedido para llevar</span>
                    </label>

                    <div class="grupo grupo-observaciones">
                        <label for="observaciones">Observaciones</label>
                        <textarea id="observaciones" name="observacion" rows="4" placeholder="Escribe aquí algún comentario sobre tu pedido"></textarea>
                    </div>
                </div>

            <div class="botones">
                 <button type="submit">Registrar pedido</button>
                 <button type="reset">Limpiar</button>
            </div>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
